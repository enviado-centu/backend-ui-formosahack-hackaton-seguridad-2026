# PostgreSQL para desarrollo. Usuario, clave y base salen de .env (POSTGRES_*).
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: detector-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Definí POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Definí POSTGRES_DB en .env}
    ports:
      # Si ya tenés un PostgreSQL local en el 5432, poné POSTGRES_PORT=5433 en .env
      # (y el mismo puerto en DATABASE_URL y TEST_DATABASE_URL)
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Crea la base de tests <POSTGRES_DB>_test la primera vez que arranca el volumen
      - ./scripts/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
